# ============================================================================
# БИБЛИОТЕКА ТРОЙНИКОВ (JUNCTION_GEOMS.YAML)
# ============================================================================
#
# Параметры каждого тройника:
#   name: уникальное имя тройника
#   source_type: тип источника данных
#     - 'config' - параметрическое задание (размеры и углы)
#     - 'file' - загрузка из CAD файла (STEP, IGES, DXF) - на перспективу
#
# Для source_type: 'config':
#   chanel_width: ширина всех каналов [м]
#   down_length: длина входного канала (нижний) [м]
#   side_length: длина бокового канала (правый) [м]
#   top_length: длина выходного канала (верхний) [м]
#   top2side_angl: угол между осями верхнего и бокового каналов [°]
#   side2down_angl: угол между осями бокового и нижнего каналов [°]
#
# Для source_type: 'file':
#   file_path: путь к CAD файлу (относительно корня проекта)
#   file_format: формат файла ('step', 'iges', 'dxf')
#
# ============================================================================

junctions:
  # --------------------------------------------------------------------------
  # T-образный тройник VMFL010 (углы 90°/90°)
  # --------------------------------------------------------------------------
  - name: 'VMFL010'
    source_type: 'config'
    chanel_width: 1.0
    down_length: 2.0
    side_length: 3.0
    top_length: 3.0
    top2side_angl: 90
    side2down_angl: 90

  # --------------------------------------------------------------------------
  # Y-образный тройник Y-60 (углы 120°/120°)
  # --------------------------------------------------------------------------
  - name: 'Y-60'
    source_type: 'config'
    chanel_width: 1.0
    down_length: 2.0
    side_length: 2.0
    top_length: 2.0
    top2side_angl: 120
    side2down_angl: 120

  # --------------------------------------------------------------------------
  # T-образный тройник с равными каналами
  # --------------------------------------------------------------------------
  - name: 'T-EQUAL'
    source_type: 'config'
    chanel_width: 1.0
    down_length: 2.0
    side_length: 2.0
    top_length: 2.0
    top2side_angl: 90
    side2down_angl: 90

  # --------------------------------------------------------------------------
  # Y-образный тройник Y-45 (углы 135°/135°)
  # --------------------------------------------------------------------------
  - name: 'Y-45'
    source_type: 'config'
    chanel_width: 1.0
    down_length: 2.0
    side_length: 2.5
    top_length: 2.5
    top2side_angl: 135
    side2down_angl: 135

  # --------------------------------------------------------------------------
  # Пример тройника из CAD файла (на перспективу)
