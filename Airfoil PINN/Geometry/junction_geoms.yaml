# chanel_width - ширина ответвления
# down_length - длина нижнего (входного) ответвления
# side_length - длина бокового (правого) ответвления
# top_length - длина верхнего (левого) ответвления
# top2side_angl - угол между осями верхнего и бокового ответвлений
# side2down_angl - угол между осями бокового и нижнего ответвлений


junctions:
  - name: 'VMFL010'
    chanel_width: 1
    down_length: 2
    side_length: 3
    top_length: 3
    top2side_angl: 90
    side2down_angl: 90

  - name: 'Y-60'
    chanel_width: 1
    down_length: 2
    side_length: 2
    top_length: 2
    top2side_angl: 120
    side2down_angl: 120