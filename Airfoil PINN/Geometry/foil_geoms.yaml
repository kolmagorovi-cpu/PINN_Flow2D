# ============================================================================
# БИБЛИОТЕКА ПРОФИЛЕЙ (FOIL_GEOMS.YAML)
# ============================================================================
# 
# Параметры каждого профиля:
#   name: уникальное имя профиля
#   source_type: тип источника данных
#     - 'file' - загрузка из файла (CSV, TXT, DAT, NPY)
#     - 'inline' - координаты указаны непосредственно в YAML
#   contour_coef: коэффициент масштабирования контура
#   x_domain_coef: коэффициент масштабирования длины расчётной области
#   y_domain_coef: коэффициент масштабирования высоты расчётной области
#
# Для source_type: 'file':
#   file_path: путь к файлу с координатами (относительно корня проекта)
#   file_format: формат файла ('csv', 'txt', 'dat', 'npy')
#
# Для source_type: 'inline':
#   X: массив X-координат точек профиля [м]
#   Y: массив Y-координат точек профиля [м]
#
# ============================================================================

foils:
  # --------------------------------------------------------------------------
  # Профиль из CSV файла. СТРУКТУРА ДЛЯ ПРИМЕРА
  # --------------------------------------------------------------------------
  - name: 'NACA0012'
    contour_coef: 1.0
    x_domain_coef: 1.0
    y_domain_coef: 15.0
    source_type: 'file'
    file_path: 'Geometry/Foils/naca0012.csv'
    file_format: 'csv'

  # --------------------------------------------------------------------------
  # Профиль из TXT/DAT файла. СТРУКТУРА ДЛЯ ПРИМЕРА
  # --------------------------------------------------------------------------
  - name: 'NACA2412'
    contour_coef: 1.0
    x_domain_coef: 1.0
    y_domain_coef: 15.0
    source_type: 'file'
    file_path: 'Geometry/Foils/naca2412.dat'
    file_format: 'txt'

  # --------------------------------------------------------------------------
  # Профиль из NPY файла. СТРУКТУРА ДЛЯ ПРИМЕРА
  # --------------------------------------------------------------------------
  - name: 'EPPLER420'
    contour_coef: 1.0
    x_domain_coef: 1.0
    y_domain_coef: 20.0
    source_type: 'file'
    file_path: 'Geometry/Foils/eppler420.npy'
    file_format: 'npy'

  # --------------------------------------------------------------------------
  # Профиль VMFL063. Тестовая задача
  # --------------------------------------------------------------------------
  - name: 'VMFL063'
    contour_coef: 1.0
    x_domain_coef: 1.0
    y_domain_coef: 20.0
    source_type: 'inline'
