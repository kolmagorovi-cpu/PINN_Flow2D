architecture:
  activation: siren
  coordinate_scaling:
    enabled: true
    mode: dataset_minmax
    input_max: 6.0
    input_min: -6.0
    scale_factor: 1.0
  hidden_layers:
  - 64
  - 64
  - 64
  - 64
  output_bias:
  - 1.0
  - 0.0
  - 0.0
  output_dim: 3
  siren_first_omega_0: 10.0
  siren_hidden_omega_0: 10.0
boundary_conditions:
  axis_symmetry:
    enforcement: soft
    kind: axis_symmetry
  farfield:
    enforcement: soft
    kind: freestream
  inlet:
    enforcement: soft
    kind: freestream
  outlet:
    enforcement: soft
    kind: pressure_outlet
  slip_wall:
    enforcement: soft
    kind: slip_wall
  symmetry:
    enforcement: soft
    kind: symmetry
  velocity_dirichlet:
    enforcement: soft
    kind: freestream
  wall:
    distance_scale: 0.02
    enforcement: soft
    kind: no_slip
checkpoint:
  allow_legacy_without_contract: true
  flow_plot_physical: false
  flow_plot_subdir: flow
  interval: 500
  load_mode: resume
  model_name_pattern: '{project_name}_{timestamp}'
  name_pattern: '{project_name}_{timestamp}'
  save_flow_images: true
  save_flow_npy: false
  strict_contract: true
checkpoint_dir: workspace/experiments
data:
  mesh_file: workspace/sampling/mesh/mesh2d.npz
  num_workers: 0
  persistent_workers: null
  pin_memory: null
  points_file: workspace/initial/fields/initial.npy
  prefetch_factor: 2
diagnostics:
  boundary_layer:
    edge_threshold: 0.99
    enabled: false
    eval_batch_size: 8192
    first_layer_height_fraction: 1.0e-05
    fit_points: 8
    growth_ratio: 1.12
    interval: 50
    layer_count: 80
    max_normal_distance_fraction: 0.08
    max_surface_points_per_side: 120
    plot_cf: true
    plot_cp: true
    plot_deficit: true
    plot_delta99: true
    plot_profiles: true
    profile_step_fraction: 0.01
    save_metrics_csv: true
    save_profiles_npz: true
    sections:
    - 0.05
    - 0.1
    - 0.2
    - 0.4
    - 0.6
    - 0.8
    - 0.95
    sides:
    - upper
    - lower
    unresolved_threshold: 0.8
    x_max_c: 0.98
    x_min_c: 0.02
  compute_grad_cosine: false
  compute_ntk_condition: false
  interval: 50
  mass_metrics_interval: 5
  section_flow:
    enabled: true
    sections:
    - -5.0
    - -1.0
    - 1.001
    - 1.2
    - 1.5
    - 2.0
    - 3.0
    - 5.0
    - 10.0
  plot_2d_spectrum: false
  plot_profiles: true
  plot_rar_error_map: true
  plot_residual_map: true
  plot_spectrum: false
  profile_sections:
  - -1.0
  - 1.001
  - 5.0
  save_rar_history: true
  spectrum_2d_resolution: 256
  spectrum_section_x: 0.5
  strict_autograd: true
enable_key_listener: true
input_features:
  angle_of_attack:
    enabled: false
  coordinates:
    enabled: true
  reynolds:
    enabled: false
    range:
    - 1000.0
    - 10000000.0
  sdf:
    enabled: true
input_params:
  coordinates: true
  density: false
  fluid_file: null
  inlet_velocity: false
  sdf: true
  viscosity: false
loss_weights:
  adaptive_bc: false
  bc_weights:
    axis_symmetry: 1.0
    axis_symmetry_grad: 1.0
    farfield: 1.0
    inlet: 1.0
    outlet: 1.0
    outlet_grad: 1.0
    slip_wall: 1.0
    symmetry: 1.0
    symmetry_grad: 1.0
    velocity_dirichlet: 1.0
    wall: 1.0
  fvm:
    activation_checkpoint: true
    batch_interval: 5
    enabled: true
    forward_chunk_size: 32768
    reduction: divergence_l2_volume
    schedule: every_k_optimizer_steps
    weight: 1.0
  integral_condition: true
  integral_weight: 1.0
  pde_weights:
    cont: 1.0
    mom_r: 1.0
    mom_x: 1.0
    mom_y: 1.0
    mom_z: 1.0
  sa_apply_to_bc: false
  use_sa_weights: false
optimizer_params:
  lr: 0.0001
  weight_decay: 0.0
output:
  console_only: true
  graphical_window:
    bc: false
    loss: true
    pde: true
  plot_frequency: 10
  progress_bar: false
  progress_bar_force: false
  progress_mininterval: 0.5
pde:
  flow_type: 2d
  pde_on_boundary: false
  system: incompressible_navier_stokes
process:
  device: cpu
  dtype: float64
  load_model_path: null
  num_gpus: 1
  seed: 42
  torch_compile: false
  torch_compile_dynamic: null
  torch_compile_fullgraph: false
  torch_compile_mode: null
  use_amp: false
project_name: test_hp_weights1
reference:
  path: null
sdf:
  absolute_tie_tolerance: 1.0e-12
  float64_consistency_tolerance: 1.0e-12
  relative_tie_tolerance: 1.0e-10
  segment_chunk_size: 256
training:
  batch_size: 5000
  boundary_rar:
    alpha: 1.5
    contour_samples: 400
    delta_max: 5.0
    delta_mode: estimated
    enabled: false
    error_weights:
      cont: 1.0
      mom_r: 1.0
      mom_x: 1.0
      mom_y: 1.0
      mom_z: 1.0
    eta_levels:
    - 0.02
    - 0.05
    - 0.1
    - 0.2
    - 0.35
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    - 3.0
    - 5.0
    fraction: 0.4
    min_distance_factor: 0.02
    num_points: null
    score_batch_size: 2048
    uniform_contour_weight: 0.5
  early_stopping:
    enabled: false
    min_delta: 1.0e-06
    patience: 100
    restore_best: true
  epochs: 2560
  flow_rar:
    enabled: true
    exclude_sdf_delta: null
    num_points: null
  grad_clip: 200.0
  gradient_accumulation_steps: 2
  full_epoch_optimizer_step: false
  lbfgs_history_size: 100
  lbfgs_max_iter: 20
  lr_cyclic_amplitude: 0.5
  lr_cyclic_period: 100
  lr_detector_factor: 2.0
  lr_detector_patience: 10
  lr_detector_recovery: 50
  lr_schedule: constant
  rar_candidate_multiplier: 12
  rar_enable: false
  rar_error_quantile: 0.75
  rar_fvm_min_new_points: 1
  rar_fvm_rebuild_every: 1
  rar_interval: 100
  rar_jitter_scale: 0.85
  rar_mesh_plot_dpi: 150
  rar_min_boundary_distance_factor: 0.05
  rar_min_distance_factor: 0.35
  rar_mode: adaptive
  rar_num_points: 200
  rar_rebuild_fvm: true
  rar_residual_power: 1.0
  rar_save_mesh_volume_plot: true
  rar_score_mode: total_loss
  reset_interval: 0
  reset_noise: 0.01
  stage1_epochs: 100
  stage2_pde_weight_end: 1.0
  stage2_pde_weight_start: 1.0
  stage2_ramp_epochs: 500
  switch_to_lbfgs_epoch: 2048
  two_stage: false
