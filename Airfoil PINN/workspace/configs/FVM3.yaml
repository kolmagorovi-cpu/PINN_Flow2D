architecture:
  activation: siren
  coordinate_scaling:
    enabled: true
    input_max: 6.0
    input_min: -6.0
    scale_factor: 1.0
  hidden_layers:
  - 50
  - 50
  - 50
  - 50
  - 50
  - 50
  - 50
  - 50
  output_bias:
  - 1.0
  - 0.0
  - 0.0
  output_dim: 3
boundary_conditions:
  wall:
    kind: no_slip
    enforcement: soft
    distance_scale: 0.02
checkpoint:
  interval: 500
  model_name_pattern: '{project_name}_{timestamp}'
  name_pattern: '{project_name}_{timestamp}'
checkpoint_dir: workspace/experiments
data:
  mesh_file: workspace/sampling/mesh/mesh2d.npz
  num_workers: 0
  persistent_workers: null
  pin_memory: null
  points_file: workspace/initial/fields/initial.npy
  prefetch_factor: 2
diagnostics:
  boundary_layer:
    edge_threshold: 0.99
    enabled: true
    eval_batch_size: 8192
    first_layer_height_fraction: 1.0e-5
    fit_points: 8
    growth_ratio: 1.12
    interval: 50
    layer_count: 80
    max_normal_distance_fraction: 0.08
    max_surface_points_per_side: 120
    plot_cf: true
    plot_cp: true
    plot_deficit: true
    plot_delta99: true
    plot_profiles: true
    profile_step_fraction: 0.01
    save_metrics_csv: true
    save_profiles_npz: true
    sections:
    - 0.05
    - 0.1
    - 0.2
    - 0.4
    - 0.6
    - 0.8
    - 0.95
    sides:
    - upper
    - lower
    unresolved_threshold: 0.8
    x_max_c: 0.98
    x_min_c: 0.02
  compute_grad_cosine: false
  compute_ntk_condition: false
  interval: 50
  mass_metrics_interval: 5
  plot_2d_spectrum: false
  plot_profiles: true
  plot_rar_error_map: true
  plot_residual_map: true
  plot_spectrum: true
  profile_sections:
  - 0.2
  - 0.5
  - 0.8
  save_rar_history: true
  spectrum_2d_resolution: 256
  spectrum_section_x: 0.5
  strict_autograd: true
enable_key_listener: true
input_params:
  coordinates: true
  density: true
  fluid_file: null
  inlet_velocity: true
  sdf: true
  viscosity: true
loss_weights:
  adaptive_bc: false
  bc_weights:
    axis_symmetry: 1.0
    axis_symmetry_grad: 1.0
    farfield: 5.0
    inlet: 10.0
    outlet: 1.0
    outlet_grad: 0.25
    slip_wall: 2.0
    symmetry: 1.0
    symmetry_grad: 1.0
    velocity_dirichlet: 1.0
    wall: 5.0
  fvm:
    batch_interval: 5
    enabled: true
    reduction: volume_weighted
    weight: 10.0
  integral_condition: false
  integral_weight: 0.0
  pde_weights:
    cont: 1.0
    mom_r: 1.0
    mom_x: 1.0
    mom_y: 1.0
    mom_z: 1.0
  sa_apply_to_bc: false
  use_sa_weights: false
optimizer_params:
  lr: 0.0003
  weight_decay: 0.0
output:
  console_only: true
  graphical_window:
    bc: false
    loss: true
    pde: true
  plot_frequency: 25
pde:
  flow_type: 2d
  pde_on_boundary: false
  system: incompressible_navier_stokes
process:
  device: cuda
  dtype: float32
  load_model_path: null
  num_gpus: 1
  seed: 42
  torch_compile: false
  torch_compile_dynamic: null
  torch_compile_fullgraph: false
  torch_compile_mode: null
  use_amp: false
project_name: FVM3
reference:
  path: null
training:
  batch_size: 1000
  boundary_rar:
    alpha: 1.5
    contour_samples: 800
    delta_max: 5.0
    delta_mode: estimated
    enabled: false
    error_weights:
      cont: 1.0
      mom_r: 3.0
      mom_x: 3.0
      mom_y: 3.0
      mom_z: 3.0
    eta_levels:
    - 0.02
    - 0.05
    - 0.1
    - 0.2
    - 0.35
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    - 3.0
    - 5.0
    fraction: 0.3
    min_distance_factor: 0.04
    num_points: 500
    score_batch_size: 2048
    uniform_contour_weight: 0.5
  early_stopping:
    enabled: false
    min_delta: 1.0e-06
    patience: 150
    restore_best: true
  epochs: 2500
  flow_rar:
    enabled: true
    exclude_sdf_delta: 5.0
    num_points: null
  grad_clip: 1.0
  gradient_accumulation_steps: 1
  lbfgs_history_size: 100
  lbfgs_max_iter: 20
  lr_cyclic_amplitude: 0.5
  lr_cyclic_period: 100
  lr_detector_factor: 2.0
  lr_detector_patience: 10
  lr_detector_recovery: 50
  lr_schedule: constant
  rar_candidate_multiplier: 10
  rar_enable: true
  rar_error_quantile: 0.8
  rar_fvm_min_new_points: 50
  rar_fvm_rebuild_every: 1
  rar_interval: 100
  rar_jitter_scale: 0.75
  rar_mesh_plot_dpi: 150
  rar_min_boundary_distance_factor: 0.1
  rar_min_distance_factor: 0.5
  rar_mode: adaptive
  rar_num_points: 300
  rar_rebuild_fvm: true
  rar_residual_power: 1.0
  rar_save_mesh_volume_plot: true
  rar_score_mode: total_loss
  reset_interval: 0
  reset_noise: 0.01
  stage1_epochs: 100
  stage2_pde_weight_end: 100000.0
  stage2_pde_weight_start: 1.0
  stage2_ramp_epochs: 500
  switch_to_lbfgs_epoch: 0
  two_stage: false
