adaptive_weights: false
batch_size: 1200
checkpoint_dir: Checkpoints
checkpoint_interval: 100
data_paths:
  points_file: Initial/Data\initial.npy
device: auto
dtype: float32
enable_key_listener: true
epochs: 2000
flow_type: symmetry
grad_clip: null
gradient_accumulation_steps: 50
integral_condition: true
integral_weight: 1000000.0
loss_weights:
  axis_symmetry: 5000.0
  axis_symmetry_grad: 5000.0
  cont: 1.0
  inlet: 5000.0
  mom_x: 1.0
  mom_y: 1.0
  outlet: 5000.0
  symmetry: 5000.0
  symmetry_grad: 5000.0
  wall: 5000.0
model_params:
  layers:
  - 50
  - 50
  - 50
  - 50
  use_boundary_encoding: true
num_gpus: 1
optimizer_params:
  lr: 0.001
output_bias: !!python/tuple
- 0.1
- 0.0
- 0.1
plot_frequency: 1
rar_enable: false
reset_interval: 0
sa_apply_to_bc: true
sa_lr: 0.001
stage1_epochs: 100
stage2_pde_weight_end: 10000.0
stage2_pde_weight_start: 1.0
stage2_ramp_epochs: 500
two_stage: true
use_amp: true
use_lbfgs: false
use_sa_weights: true
