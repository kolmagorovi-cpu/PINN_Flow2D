# ============================================================================
# Пример манифеста CFD-кейсов для пакета pipe_bend_pinn_data.
# Скопируйте в cfd_manifest.yaml и замените пути/скорости на свои.
# ============================================================================

ref_scales:
  # ЕДИНАЯ опорная скорость для всего диапазона. Не задавайте U_ref отдельно
  # для каждого кейса — иначе зависимость решения от Re «схлопывается».
  U_ref: 1.0
  # Ширина канала W [м] (длина обезразмеривания; см. pipe_bend_geoms.yaml).
  pipe_width: 0.5
  # Свойства жидкости из библиотеки «Жидкость ламинарная (Re=500)».
  density: 998.0
  dynamic_viscosity: 0.998
  # Абсолютное давление: в экспорте выход = 100000 Па (1 атм).
  static_pressure: 100000.0

geometry:
  # Контур стенки в физических метрах (.npy (N,2) или structured x,y).
  # SDF считается как расстояние до этого контура, делённое на pipe_width.
  domain_file: workspace/geometry/domains/pipe_bend_domain.npy
  closed: true

cases:
  # --- Пример формата (НЕ для реального обучения) --------------------------
  # docs/export.csv экспортирован с ДРУГОЙ геометрии:
  #   X ∈ [-3.0, 0.25], Y ∈ [-0.25, 3.0],
  # тогда как pipe_bend_domain.npy: X ∈ [-2.0, 1.25], Y ∈ [-1.25, 2.0].
  # Поэтому проверка привязки выдаст outside_domain (это ожидаемо).
  - file: docs/export.csv
    U_in: 1.0
    name: format_example

  # --- Реальные кейсы: по одному CSV на скорость из диапазона --------------
  # - file: workspace/cfd/case_U0.50.csv
  #   U_in: 0.5
  #   name: Re250
  # - file: workspace/cfd/case_U1.00.csv
  #   U_in: 1.0
  #   name: Re500
  # - file: workspace/cfd/case_U1.50.csv
  #   U_in: 1.5
  #   name: Re750
